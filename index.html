<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Apps</title>
<noscript><meta http-equiv="refresh" content="0; url=./apps/"></noscript>
<link rel="canonical" href="./apps/">
<script>
  // Quita el service worker viejo de la raíz (abarcaba todo el sitio y bloqueaba instalar las otras apps)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => {
      if (new URL(r.scope).pathname === '/') r.unregister();
    })).finally(() => location.replace('./apps/' + location.search + location.hash));
  } else {
    location.replace('./apps/' + location.search + location.hash);
  }
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">
<p>Las apps están aquí: <a href="./apps/">Ver mis apps</a></p>
</body>
</html>
