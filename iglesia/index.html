<meta name="description" content="App de la Iglesia Bíblica Viviendo por Fe, El Viejo, Chinandega: Biblia, estudios, grupos pequeños y oración.">

<style>
:root{
  --bg:#f4f7fb; --surface:#ffffff; --surface2:#e9f0f8; --ink:#0c1b2b; --muted:#5a6b7d; --line:#d9e3ee;
  --primary:#0062b2; --primary-ink:#ffffff; --accent:#ea0f17; --ok:#2e7d4f; --warn:#c2620f; --bad:#c62828;
  --shadow:0 1px 2px rgba(12,27,43,.06),0 4px 14px rgba(12,27,43,.06); --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1520; --surface:#122233; --surface2:#1a2d42; --ink:#e8eef5; --muted:#9db0c4; --line:#24384e;
    --primary:#5ea8ec; --primary-ink:#06121e; --accent:#ff5a5f; --ok:#6fcf97; --warn:#f2a65a; --bad:#ff7a7a; --shadow:none; }
}
:root[data-theme="dark"]{ --bg:#0b1520; --surface:#122233; --surface2:#1a2d42; --ink:#e8eef5; --muted:#9db0c4; --line:#24384e;
  --primary:#5ea8ec; --primary-ink:#06121e; --accent:#ff5a5f; --ok:#6fcf97; --warn:#f2a65a; --bad:#ff7a7a; --shadow:none; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700;border:0;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:760px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--primary);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.flat{box-shadow:none}
.row{display:flex;gap:10px;align-items:center}
.row.wrap2{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
textarea{min-height:70px;resize:vertical}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--surface2);font-size:12px;color:var(--muted);font-weight:500}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar.accent>i{background:var(--accent)}
.week{display:flex;gap:6px}
.week .d{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.week .d b{display:block;margin:0 auto 3px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.week .d.si b{background:var(--ok);border-color:var(--ok)}
.week .d.fut b{border-style:dashed;opacity:.6}
.week.mini .d b{width:14px;height:14px;border-width:1.5px;margin-bottom:0}
.week.mini{gap:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.list>*{border-top:1px solid var(--line);padding:11px 0}
.list>*:first-child{border-top:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;white-space:nowrap;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.grid-books{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.grid-books button,.grid-caps button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 4px;cursor:pointer;font-size:13px}
.grid-caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.grid-caps button.leido{background:var(--surface2);color:var(--ok);font-weight:600}
.scripture{font-family:Literata,Georgia,serif;font-size:19px;line-height:1.75}
.scripture sup{font-family:Inter,sans-serif;font-size:11px;color:var(--accent);font-weight:600;margin-right:3px}
.scripture p{margin:0 0 4px}
.scripture .v.hl{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:4px}
.reader-head{position:sticky;top:57px;z-index:10;background:var(--bg);padding:8px 0;display:flex;gap:8px;align-items:center}
.pdfbox{background:var(--surface2);border-radius:12px;overflow:auto;text-align:center;min-height:300px}
.pdfbox canvas{max-width:100%;height:auto;display:block;margin:0 auto;background:#fff}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,14,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw;box-shadow:var(--shadow)}
.center{min-height:80vh;display:grid;place-items:center}
.login{width:100%;max-width:380px}
.logo{width:112px;height:112px;border-radius:26px;background:#fff;padding:6px;margin:0 auto 12px;box-shadow:0 2px 12px rgba(12,27,43,.12)}
.logo img{width:100%;height:100%;display:block}
.minilogo{width:38px;height:38px;border-radius:10px;background:#fff;padding:2px;flex:0 0 38px;box-shadow:0 1px 4px rgba(12,27,43,.12)}
.marca{text-align:center;font-family:Montserrat,Inter,sans-serif;color:var(--ink)}
.marca .m1{letter-spacing:.32em;font-weight:500;font-size:12px}
.marca .m2{font-weight:800;font-size:25px;line-height:1.1;margin-top:2px}
.marca .m3{display:flex;align-items:center;gap:8px;justify-content:center;font-size:10px;letter-spacing:.22em;margin-top:5px;font-weight:500}
.marca .m3 i{flex:0 0 26px;height:2px;background:var(--primary)}
.marca .m3 b{color:var(--primary)}
.yv{font-family:Literata,Georgia,serif}
.secret{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:.06em;background:var(--surface2);padding:10px;border-radius:10px;text-align:center;user-select:all}
.day{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.day.hoy{border-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ok)}
.link{color:var(--primary);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.scrollx{overflow-x:auto}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:s 0.8s linear infinite;margin:20px auto}
@keyframes s{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.sep{height:1px;background:var(--line);margin:14px 0}
.lect{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface2);border-radius:10px;padding:8px;margin:6px 0}
.lect select,.lect input{width:auto;flex:1;min-width:80px;padding:7px 8px}
.nav button{position:relative}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--accent);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;line-height:1.4}
.mas-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 2px;cursor:pointer;color:inherit;font:inherit;border-top:1px solid var(--line)}
.list>.mas-item:first-child{border-top:0}
.mas-ic{width:38px;height:38px;border-radius:10px;background:var(--surface2);color:var(--primary);display:grid;place-items:center}
.mas-ic svg{width:22px;height:22px}
.msgs{height:calc(100vh - 330px);min-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--surface2);border-radius:var(--r)}
.msg{max-width:82%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:7px 11px}
.msg.mio{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-color:var(--primary);border-radius:14px 14px 4px 14px}
.msg-de{font-size:12px;font-weight:700;color:var(--primary)}
.msg-tx{white-space:pre-wrap;word-wrap:break-word}
.msg-h{font-size:11px;opacity:.7;text-align:right;margin-top:2px}
.msg.mio .link{color:inherit}
.enviar{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.enviar textarea{min-height:44px;max-height:140px;flex:1}
.punto-verde{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);vertical-align:middle}
.reproductor{position:fixed;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:40;width:216px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(12,27,43,.25);padding:8px}
.rep-video{width:200px;height:200px;background:#000;border-radius:8px;overflow:hidden}
.rep-video iframe{width:200px;height:200px;display:block}
.rep-tit{font-weight:700;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep-sub{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep-ctl{display:flex;justify-content:space-between;margin-top:4px}
.con-reproductor .wrap{padding-bottom:340px}
.cancion.sonando{background:var(--surface2);border-radius:10px}
.cancion.sonando b{color:var(--primary)}
</style>
</head>

var S = { token:null, yo:null, vista:'inicio', inicio:null, biblia:null, lector:{libro:43,cap:1}, cache:{} };
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){ return null; } }

// ─────────────────────────── Utilidades ───────────────────────────
function $(s,el){ return (el||document).querySelector(s); }
function $$(s,el){ return Array.prototype.slice.call((el||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m,ms){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},ms||2600); }
function iniciales(n){ return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(x){return x[0];}).join('').toUpperCase(); }
function pct(a,b){ return b? Math.max(0,Math.min(100,Math.round(a/b*100))):0; }
function barra(p,cls){ return '<div class="bar '+(cls||'')+'"><i style="width:'+p+'%"></i></div>'; }
function refTexto(l){ if(l.tipo==='biblia'){ var n=LIBROS[l.libro-1][0]; return n+' '+l.desde+(l.hasta>l.desde?'–'+l.hasta:''); } var b=(S.librosLista||[]).filter(function(x){return x.id===l.libroId;})[0]; return (b?b.titulo:'Libro')+', págs. '+l.desde+(l.hasta>l.desde?'–'+l.hasta:''); }
function fechaCorta(s){ if(!s) return ''; var p=s.slice(0,10).split('-'); var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return (+p[2])+' '+m[+p[1]-1]; }
function hoyLocal(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

function llamar(accion, datos){
  return new Promise(function(ok, mal){
    function manejar(r){
      if(r && r.ok) ok(r.data);
      else if(r && r.error==='SESION'){ salir(true); mal(new Error(r.mensaje)); }
      else mal(new Error(r? r.mensaje : 'Error desconocido'));
    }
    if(!window.google || !google.script){
      // Fuera de Apps Script (por ejemplo en GitHub Pages): se usa el servidor por POST, sin cuentas de Google.
      fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({accion:accion,token:S.token,datos:datos||{}})})
        .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(manejar).catch(function(){ mal(new Error('No hay conexión con el servidor. Revise su internet e intente de nuevo.')); });
      return;
    }
    google.script.run.withSuccessHandler(manejar).withFailureHandler(function(e){ mal(new Error(e && e.message? e.message : 'No hay conexión con el servidor.')); })
    .api(accion, S.token, datos||{});
  });
}
function err(e){ toast(e && e.message ? e.message : String(e), 4000); }

function modal(html, alAbrir){
  var m=document.createElement('div'); m.className='modal';
  m.innerHTML='<div class="sheet">'+html+'</div>';
  m.addEventListener('click',function(ev){ if(ev.target===m) m.remove(); });
  document.body.appendChild(m);
  $$('[data-cerrar]',m).forEach(function(b){ b.onclick=function(){ m.remove(); }; });
  if(alAbrir) alAbrir(m);
  return m;
}

// ─────────────────────────── IndexedDB (caché local) ───────────────────────────
var DB = (function(){
  var p=null;
  function abrir(){ if(p) return p; p=new Promise(function(ok,mal){ try{ var r=indexedDB.open('app-iglesia',1); r.onupgradeneeded=function(){ r.result.createObjectStore('kv'); }; r.onsuccess=function(){ ok(r.result); }; r.onerror=function(){ mal(r.error); }; }catch(e){ mal(e); } }); return p; }
  return {
    get:function(k){ return abrir().then(function(db){ return new Promise(function(ok){ var t=db.transaction('kv').objectStore('kv').get(k); t.onsuccess=function(){ok(t.result);}; t.onerror=function(){ok(undefined);}; }); }).catch(function(){ return undefined; }); },
    set:function(k,v){ return abrir().then(function(db){ return new Promise(function(ok){ var t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=function(){ok(true);}; t.onerror=function(){ok(false);}; }); }).catch(function(){ return false; }); }
  };
})();

// ─────────────────────────── Tiempo de estudio ───────────────────────────
var Reloj = { tipo:null, pend:{}, ultimaAccion:Date.now() };
['click','scroll','keydown','touchstart','mousemove'].forEach(function(ev){ window.addEventListener(ev,function(){ Reloj.ultimaAccion=Date.now(); },{passive:true,capture:true}); });
setInterval(function(){
  if(!Reloj.tipo || !S.token) return;
  if(document.visibilityState!=='visible') return;
  if(Date.now()-Reloj.ultimaAccion>120000) return; // sin actividad por 2 minutos: no cuenta
  Reloj.pend[Reloj.tipo]=(Reloj.pend[Reloj.tipo]||0)+1;
},1000);
function enviarTiempo(){
  Object.keys(Reloj.pend).forEach(function(t){ var s=Reloj.pend[t]; if(s>=5){ Reloj.pend[t]=0; llamar('registrarTiempo',{tipo:t,segundos:s}).catch(function(){ Reloj.pend[t]=(Reloj.pend[t]||0)+s; }); } });
}
setInterval(enviarTiempo,60000);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') enviarTiempo(); });

// ─────────────────────────── Arranque y sesión ───────────────────────────
function arrancar(){
  S.token = ls('tk');
  if(S.token){
    llamar('yo').then(function(yo){ S.yo=yo; entrar(); }).catch(function(){ pantallaLogin(); });
  } else {
    llamar('estado').then(function(e){ if(!e.hayUsuarios) pantallaPrimerAdmin(); else pantallaLogin(); }).catch(function(e){ $('#app').innerHTML='<div class="center"><div class="card login"><h2>No se pudo conectar</h2><p class="muted">'+esc(e.message)+'</p><button class="btn primary block" onclick="location.reload()">Reintentar</button></div></div>'; });
  }
}
function salir(silencioso){
  enviarTiempo();
  desconectarChat(); cerrarReproductor(); S.chatConv=null;
  if(!silencioso && S.token) llamar('cerrarSesion').catch(function(){});
  ls('tk',null); S.token=null; S.yo=null; S.inicio=null; Reloj.tipo=null; S.vista='inicio'; S.bibliaModo=null; S.librosLista=null; S.leidosHoy={};
  $$('.modal').forEach(function(m){ m.remove(); });
  pantallaLogin();

function tarjetaPlanHoy(p){
  var hechos={}; p.hechos.forEach(function(n){ hechos[n]=true; });

  var mostrar=hoyN; for(var i=1;i<=hoyN;i++){ if(!hechos[i]){ mostrar=i; break; } }
  var atrasados=0; for(var j=1;j<=p.diaHoy;j++) if(!hechos[j]) atrasados++;
  var dia=p.plan.dias[mostrar-1]||{lecturas:[]};
  var estado = p.diaHoy===0 ? '<span class="chip">Empieza el '+fechaCorta(p.inicio)+'</span>' : atrasados<=0?'<span class="chip ok">Al día</span>':'<span class="chip warn">'+atrasados+' día'+(atrasados>1?'s':'')+' pendiente'+(atrasados>1?'s':'')+'</span>';

function cargarBiblia(progreso){
  if(S.biblia) return Promise.resolve(S.biblia);
  return DB.get('biblia-rv1909').then(function(b){
    if(b){ S.biblia=b; return b; }
    function intentar(i){
      if(i>=BIBLIA_URLS.length) return Promise.reject(new Error('No se pudo descargar la Biblia. Revise su conexión.'));
      return fetch(BIBLIA_URLS[i]).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); if(progreso) progreso('Descargando la Biblia (solo la primera vez)…'); return r.json(); }).catch(function(){ return intentar(i+1); });
    }
    return intentar(0).then(function(j){
      // Compactar: [libro][cap] = [textos]
      var c=j.books.map(function(b){ return b.chapters.map(function(ch){ return ch.verses.map(function(v){ return v.text; }); }); });
      S.biblia=c; DB.set('biblia-rv1909',c); return c;
    });
  });
}

function vigilarLectura(libro, cap){
  var key=libro+'.'+cap; S.leidosHoy=S.leidosHoy||{};
  if(S.leidosHoy[key]) return;
  var inicio=Date.now(), registrado=false;
  var fin=$('#fin'); if(!fin) return;
  function intentar(){
    if(registrado) return;
    if(Date.now()-inicio<20000){ setTimeout(function(){ if(S.lector.libro===libro && S.lector.cap===cap && estaVisible(fin)) intentar(); },20000-(Date.now()-inicio)+50); return; }
    registrado=true; S.leidosHoy[key]=true;

var _pdfjs=null;
function cargarPdfjs(){
  if(_pdfjs) return _pdfjs;
  _pdfjs=new Promise(function(ok,mal){
    var s=document.createElement('script'); s.src=PDFJS+'pdf.min.js';
    s.onload=function(){
      var lib=window.pdfjsLib;
      fetch(PDFJS+'pdf.worker.min.js').then(function(r){ return r.blob(); }).then(function(b){ lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b); ok(lib); })
      .catch(function(){ lib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; ok(lib); });
    };
    s.onerror=function(){ _pdfjs=null; mal(new Error('No se pudo cargar el lector de PDF.')); };
    document.head.appendChild(s);
  });
  return _pdfjs;
}
function b64ABytes(b64){ var bin=atob(b64), n=bin.length, u=new Uint8Array(n); for(var i=0;i<n;i++) u[i]=bin.charCodeAt(i); return u; }
function bytesAB64(u8){ var s='', paso=0x8000; for(var i=0;i<u8.length;i+=paso) s+=String.fromCharCode.apply(null,u8.subarray(i,i+paso)); return btoa(s); }
function descargarLibro(id, progreso){
  return DB.get('pdf-'+id).then(function(d){
    if(d) return d;
    var partes=[];
    function parte(i){ return llamar('libroParte',{id:id,i:i}).then(function(r){ partes.push(b64ABytes(r.b64)); if(progreso) progreso(i+1,r.total); return (i+1<r.total)? parte(i+1) : null; }); }
    return parte(0).then(function(){
      var tam=partes.reduce(function(s,p){return s+p.length;},0), u=new Uint8Array(tam), o=0;
      partes.forEach(function(p){ u.set(p,o); o+=p.length; });
      DB.set('pdf-'+id,u); return u;
    });
  });
}

      return r[0].getDocument({data:r[1].slice ? r[1].slice() : r[1]}).promise;
    }).then(function(doc){

        $('#pn').value=actual;

          var box=$('#pdfbox'); if(!box) return;

          if(render) try{ render.cancel(); }catch(e){}
          render=pg.render({canvasContext:c.getContext('2d'),viewport:vp});
          render.promise.then(function(){ box.innerHTML=''; box.appendChild(c); }).catch(function(){});
        });
        clearTimeout(timer); timer=setTimeout(function(){ guardarPag(); },1500);
      }
      guardarPag=function(ya){ if(actual===guardadaEn) return; guardadaEn=actual; l.pagina=actual; l.maxPagina=Math.max(l.maxPagina||0,actual); l.paginas=total; llamar('guardarPagina',{libroId:id,pagina:actual,total:total}).catch(function(){ guardadaEn=0; }); };
      $('#pp').onclick=function(){ if(actual>1){ actual--; pintar(); window.scrollTo(0,0);} };
      $('#ps').onclick=function(){ if(actual<total){ actual++; pintar(); window.scrollTo(0,0);} };
      $('#pn').onchange=function(){ var n=+this.value; if(n>=1&&n<=total){ actual=n; pintar(); } };
      $('#zoom').onclick=function(){ escala = escala>=2?1:escala+0.5; pintar(); };
      pintar();
    }).catch(function(e){ var b=$('#pdfbox'); if(b) b.innerHTML='<div class="empty">'+esc(e.message||'No se pudo abrir el PDF.')+'</div>'; });

function mostrarClave(r, titulo){

    '<label class="f"><span>Usuario</span><div class="secret">'+esc(r.usuario)+'</div></label><label class="f"><span>Contraseña temporal</span><div class="secret">'+esc(r.claveTemporal)+'</div></label>'+
    '<div class="row" style="margin-top:10px"><button class="btn grow" id="copiar">Copiar mensaje</button><button class="btn primary grow" data-cerrar>Listo</button></div>');

function agregarMiembro(grupo){

    var m=modal('<div class="row" style="margin-bottom:8px"><h2 class="grow">Agregar a '+esc(grupo.nombre)+'</h2><button class="btn ghost" data-cerrar>Cerrar</button></div>'+
      '<form id="fn"><h3>Crear cuenta nueva</h3><label class="f"><span>Nombre completo</span><input type="text" name="n" required></label>'+
      '<label class="f"><span>Usuario</span><input type="text" name="u" autocapitalize="none" placeholder="Se sugiere a partir del nombre"></label><button class="btn primary">Crear y agregar</button></form>'+
      (libres.length?'<div class="sep"></div><h3>O agregar a alguien que ya tiene cuenta</h3><div class="list" style="margin-top:6px">'+libres.map(function(u){ return '<div class="row"><div class="grow">'+esc(u.nombre)+'<div class="tiny muted">@'+esc(u.usuario)+'</div></div><button class="btn sm" data-add="'+u.id+'">Agregar</button></div>'; }).join('')+'</div>':''));

function sugerirUsuario(n){ var p=quitarAcentos(n||'').replace(/[^a-z\s]/g,'').trim().split(/\s+/).filter(Boolean); return p.length>1? p[0]+'.'+p[1] : (p[0]||''); }

var ETIQUETAS_OK = {DIV:1,P:1,SPAN:1,SUP:1,SUB:1,BR:1,B:1,I:1,EM:1,STRONG:1,H1:1,H2:1,H3:1,H4:1,H5:1,H6:1,SMALL:1};
function limpiarHTML(html){
  var doc=new DOMParser().parseFromString('<div>'+String(html||'')+'</div>','text/html');
  (function limpiar(n){
    Array.prototype.slice.call(n.childNodes).forEach(function(h){
      if(h.nodeType===1){
        if(h.tagName==='SCRIPT'||h.tagName==='STYLE'||h.tagName==='IFRAME'||h.tagName==='OBJECT'){ h.remove(); return; }
        limpiar(h);
        Array.prototype.slice.call(h.attributes).forEach(function(a){ if(a.name!=='class') h.removeAttribute(a.name); });
        if(!ETIQUETAS_OK[h.tagName]){ while(h.firstChild) h.parentNode.insertBefore(h.firstChild,h); h.remove(); }
      } else if(h.nodeType!==3){ h.remove(); }
    });
  })(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}

var FB_SDK='https://www.gstatic.com/firebasejs/10.12.2/';
var CH={};
function reiniciarChat(){ CH={estado:'apagado', enLinea:{}, silenciados:{}, bandeja:{}, refs:[], vistaRefs:[], avisos:[]}; }
reiniciarChat();
function cargarScript(src){
  return new Promise(function(ok,mal){
    if(document.querySelector('script[src="'+src+'"]')){ ok(); return; }
    var s=document.createElement('script'); s.src=src; s.onload=function(){ ok(); }; s.onerror=function(){ mal(new Error('No se pudo cargar el chat. Revise su conexión.')); };
    document.head.appendChild(s);
  });
}
function conectarChat(){
  if(CH.promesa) return CH.promesa;
  CH.estado='conectando';
  CH.promesa=llamar('chatToken').then(function(r){
    if(!r.configurado){ CH.estado='sin-config'; return CH; }
    return cargarScript(FB_SDK+'firebase-app-compat.js').then(function(){ return cargarScript(FB_SDK+'firebase-auth-compat.js'); })
    .then(function(){ return cargarScript(FB_SDK+'firebase-database-compat.js'); })
    .then(function(){
      var app=(firebase.apps||[]).filter(function(a){ return a.name==='iglesia'; })[0] || firebase.initializeApp(r.config,'iglesia');
      var auth=app.auth();
      return auth.setPersistence(firebase.auth.Auth.Persistence.NONE).then(function(){ return auth.signInWithCustomToken(r.token); }).then(function(){
        CH.app=app; CH.db=app.database(); CH.uid=r.uid; CH.nombre=r.nombre; CH.mod=r.mod; CH.estado='listo';
        iniciarPresencia(); escucharGlobales(); avisarChat('estado');
        return CH;
      });
    });
  }).catch(function(e){ CH.estado='error'; CH.error=e.message; CH.promesa=null; avisarChat('estado'); return CH; });
  return CH.promesa;
}
function TS(){ return firebase.database.ServerValue.TIMESTAMP; }
function escuchar(lista, ref, ev, fn){ ref.on(ev, fn); lista.push([ref, ev, fn]); }
function iniciarPresencia(){
  var yo=CH.db.ref('presencia/'+CH.uid);
  escuchar(CH.refs, CH.db.ref('.info/connected'), 'value', function(s){
    if(s.val()!==true) return;
    yo.onDisconnect().set({nombre:CH.nombre, online:false, t:TS()}).then(function(){ return yo.set({nombre:CH.nombre, online:true, t:TS()}); }).catch(function(){});
  });
}
function escucharGlobales(){
  escuchar(CH.refs, CH.db.ref('presencia'), 'value', function(s){ var en={}; s.forEach(function(c){ var v=c.val(); if(v && v.online) en[c.key]=v.nombre; }); CH.enLinea=en; avisarChat('presencia'); });
  escuchar(CH.refs, CH.db.ref('silenciados'), 'value', function(s){ CH.silenciados=s.val()||{}; avisarChat('silenciados'); });
  escuchar(CH.refs, CH.db.ref('bandeja/'+CH.uid), 'value', function(s){ CH.bandeja=s.val()||{}; actualizarInsignia(); avisarChat('bandeja'); });
}
function avisarChat(tipo){ CH.avisos.forEach(function(a){ if(a[0]===tipo || a[0]==='*') try{ a[1](); }catch(e){} }); }
function alAviso(tipo, fn){ CH.avisos.push([tipo, fn]); }
function limpiarVistaChat(){
  (CH.vistaRefs||[]).forEach(function(x){ try{ x[0].off(x[1], x[2]); }catch(e){} });
  CH.vistaRefs=[]; CH.avisos=[];
}
function desconectarChat(){
  limpiarVistaChat();
  (CH.refs||[]).forEach(function(x){ try{ x[0].off(x[1], x[2]); }catch(e){} });
  try{
    if(CH.db){ CH.db.ref('presencia/'+CH.uid).set({nombre:CH.nombre, online:false, t:TS()}).catch(function(){}); }
    if(CH.app) CH.app.auth().signOut().catch(function(){});
  }catch(e){}

}
function vistoKey(cid){ return 'visto_'+(S.yo?S.yo.id:'')+'_'+cid; }

  return d.toDateString()===h.toDateString()? hora : fechaCorta(d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2))+' '+hora;

function cajaMensajes(cont, ref, opciones){
  cont.innerHTML='<div class="msgs" id="msgs"><div class="empty tiny">Cargando mensajes…</div></div>'+
    '<form class="enviar" id="fmsg"><textarea name="t" rows="1" maxlength="1000" placeholder="Escriba un mensaje…" required></textarea><button class="btn primary" aria-label="Enviar">Enviar</button></form><div id="avisoSil"></div>';
  var caja=$('#msgs',cont), f=$('#fmsg',cont), vacio=true;

  var q=ref.orderByChild('t').limitToLast(150);
  var timer=setTimeout(function(){ if(vacio) caja.innerHTML='<div class="empty tiny">'+(opciones.vacio||'Aún no hay mensajes. ¡Escriba el primero!')+'</div>'; },1500);
  escuchar(CH.vistaRefs, q, 'child_added', function(s){
    var m=s.val(); if(!m) return;
    if(vacio){ caja.innerHTML=''; vacio=false; clearTimeout(timer); }
    var pegado=abajo(), mio=m.uid===CH.uid;
    var d=document.createElement('div'); d.className='msg'+(mio?' mio':''); d.id='m_'+s.key;
    var puedeBorrar=opciones.moderable && (CH.mod || mio);
    d.innerHTML=(mio?'':'<div class="msg-de">'+esc(m.nombre)+'</div>')+'<div class="msg-tx">'+esc(m.texto)+'</div><div class="msg-h">'+horaMsg(m.t)+(puedeBorrar?' <button class="link tiny" data-acc="'+s.key+'" aria-label="Opciones del mensaje">⋯</button>':'')+'</div>';
    caja.appendChild(d);
    if(puedeBorrar) $('[data-acc]',d).onclick=function(){ opcionesMensaje(ref, s.key, m); };
    if(pegado || mio) caja.scrollTop=caja.scrollHeight;
    if(opciones.alRecibir) opciones.alRecibir(m);
  });
  escuchar(CH.vistaRefs, q, 'child_removed', function(s){ var e=document.getElementById('m_'+s.key); if(e) e.remove(); });
  var ta=f.t;
  ta.onkeydown=function(ev){ if(ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); f.requestSubmit ? f.requestSubmit() : f.onsubmit(new Event('submit')); } };
  f.onsubmit=function(ev){ if(ev && ev.preventDefault) ev.preventDefault();
    var texto=ta.value.trim(); if(!texto) return;
    var b=$('button',f); b.disabled=true;
    ref.push({uid:CH.uid, nombre:CH.nombre, texto:texto.slice(0,1000), t:TS()}).then(function(){ ta.value=''; b.disabled=false; ta.focus(); if(opciones.alEnviar) opciones.alEnviar(texto); })
    .catch(function(){ b.disabled=false; toast(opciones.general && CH.silenciados[CH.uid] ? 'Un moderador lo silenció en la sala general.' : 'No se pudo enviar el mensaje.'); });
  };
  if(opciones.general){
    var sil=function(){ var s=!!CH.silenciados[CH.uid]; ta.disabled=s; $('button',f).disabled=s; $('#avisoSil',cont).innerHTML=s?'<p class="tiny" style="color:var(--bad);margin:6px 0 0">Un moderador lo silenció en la sala general. Puede leer, pero no escribir.</p>':''; };
    sil(); alAviso('silenciados', sil);
  }

function opcionesMensaje(ref, key, m){

    c.innerHTML='<div class="rep-video"><div id="ytPlayer"></div></div><div class="rep-info"><div class="rep-tit" id="repTit"></div><div class="rep-sub tiny" id="repSub"></div>'+
      '<div class="rep-ctl"><button class="btn sm ghost" id="repAnt" aria-label="Anterior">⏮</button><button class="btn sm primary" id="repPlay" aria-label="Pausar">⏸</button><button class="btn sm ghost" id="repSig" aria-label="Siguiente">⏭</button><button class="btn sm ghost" id="repCerrar" aria-label="Cerrar reproductor">✕</button></div></div>';
    document.body.appendChild(c); document.body.classList.add('con-reproductor');
    $('#repAnt').onclick=function(){ irCancion(MP.i-1); };
    $('#repSig').onclick=function(){ irCancion(MP.i+1); };
    $('#repPlay').onclick=function(){ if(!MP.player) return; if(MP.estado===1) MP.player.pauseVideo(); else MP.player.playVideo(); };
    $('#repCerrar').onclick=cerrarReproductor;
  }
  return c;
}
function pintarReproductor(){
  var s=MP.cola[MP.i]; if(!s) return;
  $('#repTit').textContent=s.titulo||'Alabanza';
  $('#repSub').textContent=(MP.i+1)+' de '+MP.cola.length+' · '+MP.titulo;
  $('#repPlay').textContent=MP.estado===1?'⏸':'▶';
  $('#repPlay').setAttribute('aria-label', MP.estado===1?'Pausar':'Reproducir');
  $('#repAnt').disabled=MP.i<=0; $('#repSig').disabled=MP.i>=MP.cola.length-1;
  $$('[data-sonando]').forEach(function(e){ e.classList.toggle('sonando', e.dataset.sonando===s.id); });
}
function reproducirLista(lista, desde){
  if(!lista.canciones.length){ toast('Esta lista no tiene canciones todavía.'); return; }
  MP.cola=lista.canciones.slice(); MP.i=desde||0; MP.titulo=lista.titulo;
  reproductorHTML(); pintarReproductor();
  cargarYouTube().then(function(YT){
    var id=MP.cola[MP.i].videoId;
    if(MP.player && MP.player.loadVideoById){ MP.player.loadVideoById(id); return; }
    MP.player=new YT.Player('ytPlayer',{
      host:'https://www.youtube-nocookie.com', width:'200', height:'200', videoId:id,
      playerVars:{playsinline:1, rel:0, autoplay:1},
      events:{
        onReady:function(e){ try{ e.target.playVideo(); }catch(x){} },
        onStateChange:function(e){ MP.estado=e.data; if(e.data===0){ if(MP.i<MP.cola.length-1) irCancion(MP.i+1); else { toast('Terminó la lista "'+MP.titulo+'".'); } } pintarReproductor(); },
        onError:function(){ var s=MP.cola[MP.i]; toast('No se pudo reproducir "'+(s?s.titulo:'')+'". Paso a la siguiente.'); setTimeout(function(){ if(MP.i<MP.cola.length-1) irCancion(MP.i+1); }, 900); }
      }
    });
  }).catch(function(){ toast('No se pudo cargar YouTube. Revise su conexión.'); cerrarReproductor(); });
}
function irCancion(i){
  if(i<0 || i>=MP.cola.length) return;
  MP.i=i; pintarReproductor();
  if(MP.player && MP.player.loadVideoById) MP.player.loadVideoById(MP.cola[i].videoId);
}
function cerrarReproductor(){
  try{ if(MP.player && MP.player.destroy) MP.player.destroy(); }catch(e){}
  MP.player=null; MP.cola=[]; MP.estado='';
  var c=$('#reproductor'); if(c) c.remove(); document.body.classList.remove('con-reproductor');
  $$('[data-sonando]').forEach(function(e){ e.classList.remove('sonando'); });
}
function vMusica(el){
  Reloj.tipo=null;
  llamar('listasAlabanza').then(function(d){
    S.alabanzas=d;
    var html='<div class="row" style="margin-bottom:6px"><h1 class="grow">Alabanzas</h1>'+(d.puedeEditar?'<button class="btn primary" id="nuevaLista">+ Lista</button>':'')+'</div>'+
      '<p class="small muted" style="margin:0 0 14px">Listas preparadas por el ministerio de alabanza. La música sigue sonando mientras usa el resto de la app, con la pantalla encendida.</p>';
    if(!d.listas.length) html+='<div class="card empty">Todavía no hay listas de alabanzas.'+(d.puedeEditar?' Cree la primera con el botón de arriba.':'')+'</div>';
    d.listas.forEach(function(l){
      var abierta=MP.abierta===l.id;
      html+='<div class="card"><div class="row"><div class="grow" style="cursor:pointer" data-abrir="'+l.id+'"><h2>'+esc(l.titulo)+'</h2><div class="tiny muted">'+l.canciones.length+' canci'+(l.canciones.length===1?'ón':'ones')+(l.descripcion?' · '+esc(l.descripcion):'')+'</div></div>'+
        '<button class="btn primary sm" data-play="'+l.id+'"'+(l.canciones.length?'':' disabled')+'>▶ Reproducir</button>'+(d.puedeEditar?'<button class="btn ghost sm" data-editl="'+l.id+'" aria-label="Editar lista">⋯</button>':'')+'</div>';
      if(abierta){
        html+='<div class="list" style="margin-top:8px">'+l.canciones.map(function(c,i){
          return '<div class="row cancion" data-sonando="'+c.id+'"><button class="btn ghost sm" data-pc="'+l.id+'|'+i+'" aria-label="Reproducir esta">▶</button><div class="grow" style="min-width:0"><div class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b>'+esc(c.titulo)+'</b></div><div class="tiny muted">'+esc(c.autor||'')+'</div></div>'+
            (d.puedeEditar?'<button class="btn ghost sm" data-mv="'+c.id+'|-1" aria-label="Subir"'+(i===0?' disabled':'')+'>↑</button><button class="btn ghost sm" data-mv="'+c.id+'|1" aria-label="Bajar"'+(i===l.canciones.length-1?' disabled':'')+'>↓</button><button class="btn ghost sm" data-qc="'+c.id+'" aria-label="Quitar">✕</button>':'')+'</div>';
        }).join('')+'</div>'+(d.puedeEditar?'<button class="btn sm" style="margin-top:8px" data-agregar="'+l.id+'">+ Agregar canciones</button>':'');
      }
      html+='</div>';
    });
    el.innerHTML=html;
    var lista=function(id){ return d.listas.filter(function(x){return x.id===id;})[0]; };
    if($('#nuevaLista',el)) $('#nuevaLista',el).onclick=function(){ formLista(null); };
    $$('[data-abrir]',el).forEach(function(b){ b.onclick=function(){ MP.abierta = MP.abierta===b.dataset.abrir? null : b.dataset.abrir; vMusica(el); }; });
    $$('[data-play]',el).forEach(function(b){ b.onclick=function(){ MP.abierta=b.dataset.play; reproducirLista(lista(b.dataset.play),0); vMusica(el); }; });
    $$('[data-pc]',el).forEach(function(b){ b.onclick=function(){ var p=b.dataset.pc.split('|'); reproducirLista(lista(p[0]), +p[1]); }; });
    $$('[data-editl]',el).forEach(function(b){ b.onclick=function(){ formLista(lista(b.dataset.editl)); }; });
    $$('[data-agregar]',el).forEach(function(b){ b.onclick=function(){ formCanciones(lista(b.dataset.agregar)); }; });
    $$('[data-mv]',el).forEach(function(b){ b.onclick=function(){ var p=b.dataset.mv.split('|'); b.disabled=true; llamar('editarCancion',{id:p[0],mover:+p[1]}).then(function(){ vMusica(el); }).catch(err); }; });
    $$('[data-qc]',el).forEach(function(b){ b.onclick=function(){ if(confirm('¿Quitar esta canción de la lista?')) llamar('editarCancion',{id:b.dataset.qc,quitar:true}).then(function(){ vMusica(el); }).catch(err); }; });
    if(MP.cola.length) pintarReproductor();
  }).catch(function(e){ el.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}
function formLista(l){
  var m=modal('<div class="row" style="margin-bottom:8px"><h2 class="grow">'+(l?'Editar lista':'Nueva lista')+'</h2><button class="btn ghost" data-cerrar>Cerrar</button></div>'+
    '<form id="fl2"><label class="f"><span>Nombre</span><input type="text" name="t" required maxlength="100" value="'+esc(l?l.titulo:'')+'" placeholder="ej. Alabanzas del domingo"></label>'+
    '<label class="f"><span>Descripción (opcional)</span><input type="text" name="d" maxlength="500" value="'+esc(l?l.descripcion:'')+'"></label>'+
    (l?'':'<label class="f"><span>Enlaces de YouTube (opcional, uno por línea)</span><textarea name="e" placeholder="https://youtu.be/..."></textarea></label>')+
    '<div class="row">'+(l?'<button type="button" class="btn danger" id="borrarL">Eliminar lista</button>':'')+'<span class="grow"></span><button class="btn primary">Guardar</button></div><p class="small muted" id="estL"></p></form>');
  var f=$('#fl2',m);
  f.onsubmit=function(ev){ ev.preventDefault(); var b=$('button.primary',f); b.disabled=true;
    llamar('guardarListaAlabanza',{id:l&&l.id,titulo:f.t.value,descripcion:f.d.value}).then(function(id){
      if(!l && f.e && f.e.value.trim()){ $('#estL',m).textContent='Agregando canciones…'; return llamar('agregarCanciones',{listaId:id,enlaces:f.e.value}).then(function(r){ MP.abierta=id; avisoCanciones(r); }); }
      MP.abierta=l?l.id:id;
    }).then(function(){ m.remove(); ir('musica'); }).catch(function(e){ b.disabled=false; $('#estL',m).textContent=''; err(e); }); };
  if(l) $('#borrarL',m).onclick=function(){ if(confirm('¿Eliminar la lista "'+l.titulo+'"?')) llamar('guardarListaAlabanza',{id:l.id,eliminar:true}).then(function(){ m.remove(); ir('musica'); }).catch(err); };
}
function formCanciones(l){
  var m=modal('<div class="row" style="margin-bottom:8px"><h2 class="grow">Agregar a "'+esc(l.titulo)+'"</h2><button class="btn ghost" data-cerrar>Cerrar</button></div>'+
    '<p class="small muted" style="margin-top:0">En YouTube toque <b>Compartir → Copiar enlace</b> y péguelo aquí. Puede pegar varios, uno por línea.</p>'+
    '<form id="fc2"><textarea name="e" required placeholder="https://youtu.be/..." style="min-height:120px"></textarea><button class="btn primary block" style="margin-top:8px">Agregar</button><p class="small muted" id="estC"></p></form>');
  var f=$('#fc2',m);
  f.onsubmit=function(ev){ ev.preventDefault(); var b=$('button',f); b.disabled=true; $('#estC',m).textContent='Buscando las canciones en YouTube…';
    llamar('agregarCanciones',{listaId:l.id,enlaces:f.e.value}).then(function(r){ m.remove(); MP.abierta=l.id; avisoCanciones(r); ir('musica'); })
    .catch(function(e){ b.disabled=false; $('#estC',m).textContent=''; err(e); }); };
}
function avisoCanciones(r){
  if(!r.fallidas.length){ toast(r.agregadas+' canci'+(r.agregadas===1?'ón agregada':'ones agregadas')+'.'); return; }
  modal('<h2>Canciones agregadas: '+r.agregadas+'</h2><p class="small">Estas no se pudieron agregar:</p><div class="list">'+r.fallidas.map(function(f){ return '<div class="small"><b style="word-break:break-all">'+esc(f.enlace)+'</b><div class="tiny muted">'+esc(f.motivo)+'</div></div>'; }).join('')+'</div><button class="btn primary block" data-cerrar style="margin-top:10px">Entendido</button>');
}

// ─────────────────────────── Ajustes: Firebase ───────────────────────────
function pintarAjustesFirebase(c, a){
  if(!c) return;
  c.innerHTML='<div class="card"><h2>Chat (Firebase)</h2>'+
    (a.firebase?'<p class="small">Conectado al proyecto <b>'+esc(a.firebase)+'</b>. <button class="link small" id="quitarFB">Desconectar</button></p><div class="row wrap2" style="gap:8px"><button class="btn primary" id="probarFB">Probar seguridad del chat</button></div><div id="resFB"></div>'
      :'<p class="small">Para activar el chat y ver quién está en línea, cree un proyecto gratuito en <b>console.firebase.google.com</b> con la cuenta de la iglesia y pegue aquí los dos datos que le indique el instructivo.</p>')+
    '<details'+(a.firebase?'':' open')+' style="margin-top:10px"><summary class="small" style="cursor:pointer">'+(a.firebase?'Cambiar configuración':'Pegar configuración')+'</summary>'+
    '<form id="ffb"><label class="f"><span>1. Configuración de la app web (bloque firebaseConfig)</span><textarea name="c" required placeholder="const firebaseConfig = { apiKey: ..., databaseURL: ..., ... };" style="min-height:110px;font-family:ui-monospace,monospace;font-size:12px"></textarea></label>'+
    '<label class="f"><span>Dirección de la Realtime Database (solo si no viene en el bloque anterior)</span><input type="text" name="u" placeholder="https://....firebaseio.com"></label>'+
    '<label class="f"><span>2. Clave de la cuenta de servicio (contenido del archivo JSON)</span><textarea name="k" required placeholder="{ &quot;type&quot;: &quot;service_account&quot;, ... }" style="min-height:110px;font-family:ui-monospace,monospace;font-size:12px"></textarea></label>'+
    '<button class="btn primary">Guardar y activar el chat</button><p class="small muted" id="estFB"></p></form></details></div>';
  var f=$('#ffb',c);
  f.onsubmit=function(ev){ ev.preventDefault(); var b=$('button.primary',f); b.disabled=true; $('#estFB',c).textContent='Instalando las reglas de seguridad…';
    llamar('guardarFirebase',{config:f.c.value,databaseURL:f.u.value,cuenta:f.k.value}).then(function(r){ f.reset(); toast('Chat activado en el proyecto '+r.proyecto+'.'); desconectarChat(); ir('admin',{tab:'ajustes'}); })
    .catch(function(e){ b.disabled=false; $('#estFB',c).textContent=''; err(e); }); };
  if($('#quitarFB',c)) $('#quitarFB',c).onclick=function(){ if(confirm('¿Desconectar el chat? Los mensajes quedan guardados en Firebase.')) llamar('guardarFirebase',{quitar:true}).then(function(){ desconectarChat(); ir('admin',{tab:'ajustes'}); }).catch(err); };
  if($('#probarFB',c)) $('#probarFB',c).onclick=function(){ var b=this; b.disabled=true; $('#resFB',c).innerHTML='<p class="small muted">Probando con usuarios ficticios… (unos segundos)</p>';
    llamar('probarChat').then(function(r){ b.disabled=false;
      $('#resFB',c).innerHTML='<p class="small" style="margin-bottom:4px"><b style="color:'+(r.aprobadas===r.total?'var(--ok)':'var(--bad)')+'">'+r.aprobadas+' de '+r.total+' pruebas correctas</b></p><div class="list">'+r.casos.map(function(x){ return '<div class="tiny">'+(x.ok?'✓':'✗')+' '+esc(x.prueba)+' — '+(x.obtenido?'permitido':'bloqueado')+'</div>'; }).join('')+'</div>';
    }).catch(function(e){ b.disabled=false; $('#resFB',c).innerHTML=''; err(e); }); };
}

arrancar();
if('serviceWorker' in navigator && location.protocol==='https:'){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
</script>
</body>
